name: Database Backup

# Runs twice a week (not just once) to stay well clear of Supabase's
# free-tier pause-on-inactivity window, and doubles as the backup job:
# actually connecting and dumping the DB counts as real activity.
on:
  schedule:
    - cron: '0 12 * * 1,4' # Monday & Thursday, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        # Ubuntu's default apt repo only has pg_dump 16, but Supabase runs
        # Postgres 17 - pg_dump refuses to dump from a newer server, so pull
        # the client from PGDG's own repo instead to keep it current.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges -f "/tmp/backup-$(date +%Y-%m-%d).sql"

      - name: Commit dump to backups branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin backups >/dev/null 2>&1; then
            git fetch origin backups:backups
            git checkout backups
          else
            # First run ever: bootstrap the branch, empty of master's files.
            git checkout --orphan backups
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/backup-*.sql .
          git add backup-*.sql
          git commit -m "Database backup $(date +%Y-%m-%d)"
          git push origin backups
